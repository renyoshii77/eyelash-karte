<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アイラッシュ カルテ ビューアー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF5F1;
    --card:#FFFFFF;
    --ink:#3E332E;
    --muted:#9C8A82;
    --accent:#B3697A;
    --accent-deep:#8F4F5E;
    --gold:#C9A66B;
    --line:#E7D9CF;
    --line-soft:#F1E6DE;
    --sage:#8C9A85;
    --danger:#B25C4F;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 50% -10%, #FDF0EA 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  header{
    padding:30px 20px 18px;
    text-align:center;
    position:relative;
  }
  header::after{
    content:"";
    display:block;
    width:64px;
    height:2px;
    background:var(--gold);
    margin:14px auto 0;
    opacity:.7;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.35em;
    color:var(--accent-deep);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:24px;
    margin:0;
    letter-spacing:.06em;
  }
  .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }

  main{ max-width:520px; margin:0 auto; padding:0 16px; }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line-soft);
    box-shadow:0 10px 30px -18px rgba(94,58,53,.35);
    padding:20px 18px;
    margin-bottom:18px;
  }

  .field{ margin-bottom:10px; }
  .field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    letter-spacing:.08em;
    margin-bottom:5px;
  }
  input[type=text]{
    width:100%;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    background:#FDFBFA;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    outline:none;
  }
  input:focus{ border-color:var(--accent); background:#fff; }

  .btn{
    appearance:none;
    border:none;
    border-radius:999px;
    padding:12px 18px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.05em;
    cursor:pointer;
  }
  .btn-primary{
    width:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-deep));
    color:#fff;
    box-shadow:0 10px 20px -10px rgba(143,79,94,.6);
  }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-ghost{
    background:none;
    color:var(--muted);
    font-size:12px;
    text-decoration:underline;
    padding:6px;
  }

  .status-msg{
    text-align:center;
    font-size:11px;
    color:var(--sage);
    min-height:16px;
    margin-top:8px;
  }
  .status-msg.err{ color:var(--danger); }

  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    margin:22px 4px 10px;
  }
  .toolbar input{ flex:1; }
  .updated-at{
    font-size:11px;
    color:var(--muted);
    text-align:right;
    margin:0 4px 14px;
  }

  .customer{
    background:var(--card);
    border:1px solid var(--line-soft);
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .customer-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    cursor:pointer;
  }
  .customer-name{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .customer-name::before{
    content:"";
    width:4px; height:14px;
    background:var(--accent);
    border-radius:2px;
    display:inline-block;
  }
  .customer-meta{
    font-size:11px;
    color:var(--muted);
  }
  .chevron{
    color:var(--muted);
    font-size:12px;
    transition:transform .15s;
  }
  .customer.open .chevron{ transform:rotate(180deg); }

  .customer-body{
    display:none;
    padding:0 16px 16px;
  }
  .customer.open .customer-body{ display:block; }

  .visit{
    background:var(--bg);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .visit:last-child{ margin-bottom:0; }
  .visit-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .visit-date{ font-weight:700; font-size:13px; }
  .visit-staff{ font-size:11px; color:var(--muted); }
  .visit-cond{ font-size:11px; color:var(--sage); margin-bottom:8px; }
  .visit-zones{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin-bottom:6px;
  }
  .zone-box{
    background:#fff;
    border:1px solid var(--line-soft);
    border-radius:8px;
    padding:6px 7px;
    font-size:11px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .zone-box .zk{
    display:block;
    font-size:9px;
    color:var(--accent-deep);
    font-weight:700;
    margin-bottom:2px;
  }
  .visit-remarks{
    font-size:11px;
    background:#fff;
    border:1px solid var(--line-soft);
    border-radius:8px;
    padding:6px 7px;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:36px 10px;
    line-height:1.8;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Eyelash Record Viewer</p>
  <h1>カルテ ビューアー</h1>
  <p class="sub">スプレッドシートのデータをそのまま確認</p>
</header>

<main>

  <section class="card">
    <div class="field">
      <label for="fWebAppUrl">Apps Script ウェブアプリURL</label>
      <input type="text" id="fWebAppUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <button class="btn btn-primary" id="loadBtn">スプレッドシートを読み込む</button>
    <p class="status-msg" id="statusMsg"></p>
    <p class="btn-ghost" id="howToLink" style="text-align:center;cursor:pointer;">URLの調べ方</p>
    <div id="howToBox" style="display:none;font-size:12px;line-height:1.9;color:var(--ink);background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:6px;">
      カルテ入力アプリの「Google スプレッドシート連携」欄に設定した、Apps ScriptのウェブアプリURL（送信用）と同じものをここに貼り付けてください。
    </div>
  </section>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="お客様のお名前で検索">
    <button class="btn" id="refreshBtn" style="background:var(--gold);color:#fff;">更新</button>
  </div>
  <p class="updated-at" id="updatedAt"></p>

  <div id="list"></div>

</main>

<script>
const SETTINGS_KEY = 'eyelash_karte_settings';
const $ = (id) => document.getElementById(id);
let sheetData = {}; // { customerName: [ {date,staff,cond,inner,middle,outer,remarks}, ... ] }
let webAppUrl = '';

async function loadSavedUrl(){
  try{
    const res = await window.storage.get(SETTINGS_KEY, false);
    if(res){
      const s = JSON.parse(res.value);
      if(s.webAppUrl){
        webAppUrl = s.webAppUrl;
        $('fWebAppUrl').value = webAppUrl;
      }
    }
  }catch(e){ /* 設定が見つからなければ手入力してもらう */ }
}

async function saveUrl(url){
  try{
    let s = {};
    try{
      const res = await window.storage.get(SETTINGS_KEY, false);
      if(res) s = JSON.parse(res.value);
    }catch(e){}
    s.webAppUrl = url;
    await window.storage.set(SETTINGS_KEY, JSON.stringify(s), false);
  }catch(e){ /* 保存できなくても閲覧は続行 */ }
}

function showStatus(msg, isError){
  const el = $('statusMsg');
  el.textContent = msg;
  el.classList.toggle('err', !!isError);
}

async function fetchData(){
  const url = $('fWebAppUrl').value.trim();
  if(!url){
    showStatus('Apps ScriptのURLを入力してください', true);
    return;
  }
  webAppUrl = url;
  showStatus('読み込み中…');
  try{
    const res = await fetch(webAppUrl, { method: 'GET' });
    const data = await res.json();
    sheetData = data || {};
    await saveUrl(url);
    render();
    const now = new Date();
    $('updatedAt').textContent = '最終更新：' + now.toLocaleString('ja-JP', {hour12:false});
    showStatus('読み込みました');
  }catch(err){
    showStatus('読み込みに失敗しました。URLと共有設定をご確認ください', true);
  }
}

function formatDate(iso){
  if(!iso) return '（日付未入力）';
  const s = String(iso);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}年${m[2]}月${m[3]}日`;
  return s;
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const list = $('list');
  const q = $('searchBox').value.trim();
  const names = Object.keys(sheetData)
    .filter(n => !q || n.includes(q))
    .sort((a,b) => a.localeCompare(b, 'ja'));

  if(!names.length){
    list.innerHTML = `<p class="empty">${Object.keys(sheetData).length ? '該当するお客様が見つかりません' : 'まだデータがありません。上のURLからスプレッドシートを読み込んでください。'}</p>`;
    return;
  }

  list.innerHTML = names.map((name, idx) => {
    const visits = [...(sheetData[name] || [])].sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
    const visitsHtml = visits.map(v => `
      <div class="visit">
        <div class="visit-top">
          <span class="visit-date">${formatDate(v.date)}</span>
          <span class="visit-staff">担当：${v.staff ? escapeHtml(v.staff) : '－'}</span>
        </div>
        ${v.cond ? `<div class="visit-cond">体調：${escapeHtml(v.cond)}</div>` : ''}
        <div class="visit-zones">
          <div class="zone-box"><span class="zk">目頭</span>${escapeHtml(v.inner) || '－'}</div>
          <div class="zone-box"><span class="zk">真ん中</span>${escapeHtml(v.middle) || '－'}</div>
          <div class="zone-box"><span class="zk">右</span>${escapeHtml(v.outer) || '－'}</div>
        </div>
        ${v.remarks ? `<div class="visit-remarks"><span class="zk">備考</span>${escapeHtml(v.remarks)}</div>` : ''}
      </div>
    `).join('');

    return `
      <div class="customer${idx===0 ? ' open' : ''}" data-name="${escapeHtml(name)}">
        <div class="customer-head">
          <span class="customer-name">${escapeHtml(name)}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="customer-meta">${visits.length}件</span>
            <span class="chevron">▼</span>
          </span>
        </div>
        <div class="customer-body">${visitsHtml}</div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.customer-head').forEach(head => {
    head.addEventListener('click', () => {
      head.closest('.customer').classList.toggle('open');
    });
  });
}

$('loadBtn').addEventListener('click', fetchData);
$('refreshBtn').addEventListener('click', fetchData);
$('searchBox').addEventListener('input', render);
$('howToLink').addEventListener('click', () => {
  const box = $('howToBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
});

loadSavedUrl();
</script>

</body>
</html>
